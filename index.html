<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SENDWAYO EXPRESS</title><style>html,body{margin:0;width:100%;height:100%;background:#071a36;font-family:Arial,sans-serif}#gate{position:fixed;inset:0;z-index:999999;display:flex;align-items:center;justify-content:center;background:#071a36;padding:20px}.box{width:min(390px,100%);background:white;border-radius:18px;padding:28px;box-shadow:0 20px 60px #0008}.box h1{text-align:center;color:#09245d;font-size:24px}.box p{text-align:center;color:#64748b;font-size:13px}.box label{display:block;font-size:12px;font-weight:bold;margin:12px 0 6px}.box input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:10px}.box button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:#0a245e;color:white;font-weight:800}.err{display:none;color:#b91c1c;background:#fee2e2;padding:8px;margin-top:10px;border-radius:8px;text-align:center;font-size:12px}#loading{display:none;position:fixed;inset:0;align-items:center;justify-content:center;color:white;font-weight:bold}iframe{display:none;position:fixed;inset:0;width:100%;height:100%;border:0}</style></head><body><div id="gate"><form class="box" id="login"><h1>SENDWAYO EXPRESS</h1><p>Inicie sesión para acceder a la plataforma.</p><label>Usuario</label><input id="u" type="email" autocomplete="username" required><label>Contraseña</label><input id="p" type="password" autocomplete="current-password" required><label>Tipo de acceso</label><select id="r" style="width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:10px"><option value="Administrador">Administrador</option><option value="Agente">Agente</option><option value="Remitente">Remitente</option></select><button>INICIAR SESIÓN</button><div class="err" id="err">Usuario o contraseña incorrectos.</div></form></div><div id="loading">Cargando SENDWAYO EXPRESS…</div><iframe id="app"></iframe><script>
const ACC=[['sendwayoexpress@gmail.com','Administrador','ADMINISTRADOR','ADMIN-01'],['heraceherace@gmail.com','Agente','FLEURANVIL Herace','AG-00'],['heraceherace@gmail.com','Remitente','FLEURANVIL Herace','ID65734482'],['daniasaithilaire@gmail.com','Remitente','DANIA SAINTHILAIRE','ID65734452'],['editaalberto@gmail.com','Remitente','EDITA ALBERTO','ID-PENDIENTE']];
const PH='ef797c8118f02dfb649607dd5d3f8c7623048c9c063d532cc95c5ed7a898a64f';
async function digest(x){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(x));return [...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}
document.getElementById('login').onsubmit=async e=>{e.preventDefault();const u=document.getElementById('u').value.trim().toLowerCase(),p=await digest(document.getElementById('p').value),role=document.getElementById('r').value,a=ACC.find(x=>x[0]===u&&x[1]===role&&p===PH);if(!a){document.getElementById('err').style.display='block';return}sessionStorage.setItem('swUser',JSON.stringify({email:a[0],role:a[1],name:a[2],id:a[3]}));document.getElementById('gate').style.display='none';boot()};
const PEOPLE=[['829 829 215 5657','FLEURANVIL Herace'],['849 372 7884','DANIA SAINTHILAIRE'],['829 964 4061','EDITA ALBERTO'],['+509 4124 2170','RENETTE Elissaint'],['+509 3376 1163','MANITA JOSEPH'],['+509 4499 4263','Betina Lindor']];
const CODES=['+1','+1-809','+1-829','+1-849','+509','+33','+34','+39','+44','+49','+55','+52','+57','+58','+51','+53','+32','+41','+351','+1-514','+1-416','+81','+82','+86','+91','+27','+61','+64','+65','+971','+972'];
const N=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function enhance(d){if(!d)return;
const s=d.createElement('style');s.textContent='.sw-suggest{position:absolute;left:0;right:0;top:100%;z-index:99999;background:#fff;border:1px solid #cbd5e1;border-radius:10px;max-height:220px;overflow:auto;box-shadow:0 10px 25px #0002}.sw-suggest button{display:block;width:100%;padding:9px;border:0;background:white;text-align:left}.sw-tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.sw-tools input{flex:1;min-width:220px;padding:7px 12px;border:1px solid #cbd5e1;border-radius:999px}';d.head.appendChild(s);
d.querySelectorAll('select').forEach(x=>{const q=N(x.parentElement?.innerText);if(/codigo pais|código país|country code|telefono|celular|phone/.test(q))CODES.forEach(c=>{if(![...x.options].some(o=>o.value===c)){const o=d.createElement('option');o.value=c;o.textContent=c;x.appendChild(o)}})});
d.querySelectorAll('input').forEach(i=>{if(i.dataset.sw)return;const q=N((i.placeholder||'')+' '+(i.getAttribute('aria-label')||'')+' '+(i.parentElement?.innerText||''));if(!/benefici|remitent|expediteur|agente|telefono|celular|whatsapp|numero|phone|nombre/.test(q))return;i.dataset.sw=1;const w=i.parentElement;if(getComputedStyle(w).position==='static')w.style.position='relative';const b=d.createElement('div');b.className='sw-suggest';b.style.display='none';w.appendChild(b);const draw=()=>{const v=N(i.value),z=v.replace(/\D/g,'');if(!v){b.style.display='none';return}const rows=PEOPLE.filter(x=>N(x[1]).includes(v)||x[0].replace(/\D/g,'').includes(z));b.innerHTML='';rows.forEach(x=>{const a=d.createElement('button');a.type='button';a.innerHTML='<b>'+x[0]+'</b> ('+x[1]+')';a.onmousedown=e=>{e.preventDefault();i.value=x[0]+' ('+x[1]+')';b.style.display='none';i.dispatchEvent(new Event('input',{bubbles:true}));i.dispatchEvent(new Event('change',{bubbles:true}))};b.appendChild(a)});b.style.display=rows.length?'block':'none'};i.oninput=draw;i.onfocus=draw});
d.querySelectorAll('table').forEach(t=>{if(t.parentElement.querySelector('.sw-tools'))return;const bar=d.createElement('div');bar.className='sw-tools';const q=d.createElement('input');q.placeholder='Búsqueda por nombre, celular o ID';q.oninput=()=>{const v=N(q.value);t.querySelectorAll('tbody tr').forEach(r=>r.style.display=!v||N(r.innerText).includes(v)?'':'none')};bar.appendChild(q);['Excel','PDF','CSV'].forEach(f=>{const b=d.createElement('button');b.textContent=f;b.onclick=()=>{const rows=[...t.rows].map(r=>[...r.cells].map(c=>c.innerText));if(f==='CSV'){const a=d.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'}));a.download='SENDWAYO.csv';a.click()}else if(f==='Excel'){const a=d.createElement('a');a.href='data:application/vnd.ms-excel,'+encodeURIComponent(rows.map(r=>r.join('\t')).join('\n'));a.download='SENDWAYO.xls';a.click()}else{const w=window.open('','_blank');if(w){w.document.write(t.outerHTML);w.print();w.close()}}};bar.appendChild(b)});t.parentElement.insertBefore(bar,t)});
d.querySelectorAll('input,textarea,label').forEach(x=>{if(/beneficiario/.test(N(x.innerText+' '+x.placeholder))&&/paquetico|paqueti|bulto/.test(N(x.closest('section,form,div')?.innerText)))x.style.display='none'});
d.querySelectorAll('table tbody').forEach(tb=>[...tb.rows].forEach((r,i)=>{if(/^\d+$/.test(r.cells[0]?.innerText.trim()))r.cells[0].innerText=String(i+1).padStart(2,'0')}));
d.querySelectorAll('.fixed.inset-0').forEach(m=>{const p=m.querySelector('.bg-white');if(!p||p.dataset.swWm||!/comprobante|recibo|aprobado/i.test(p.innerText||''))return;const src=p.querySelector('img')?.src||d.querySelector('img[alt*="SENDWAYO EXPRESS"]')?.src;if(!src)return;p.dataset.swWm=1;const w=d.createElement('div');w.style.cssText='position:absolute;inset:80px 10px 70px;z-index:0;pointer-events:none;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:12px;opacity:.055';for(let i=0;i<6;i++){const im=d.createElement('img');im.src=src;im.style.cssText='width:100%;height:100%;object-fit:contain';w.appendChild(im)}p.prepend(w)});
new MutationObserver(()=>setTimeout(()=>enhance(d),100)).observe(d.body,{childList:true,subtree:true})}
async function boot(){document.getElementById('loading').style.display='flex';const f=document.getElementById('app');try{const r=await navigator.serviceWorker.register('sw.js',{scope:'./'});const show=()=>{f.style.display='block';document.getElementById('loading').style.display='none';f.src='base.html';f.onload=()=>enhance(f.contentDocument)};if(navigator.serviceWorker.controller)show();else{navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload(),{once:true});await r.update();setTimeout(()=>{if(!navigator.serviceWorker.controller)location.reload()},1500)}}catch(e){document.getElementById('loading').textContent='No se pudo cargar SENDWAYO EXPRESS.'}}
</script></body></html>
